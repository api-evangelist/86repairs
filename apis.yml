description: >-
  86 Repairs is a restaurant equipment repair and maintenance (R&M) management platform founded in
  2018 in Chicago by Daniel Estrada and Joe Gallagher. It manages the repair lifecycle for restaurant
  operators — 24/7 intake and troubleshooting, warranty verification, dispatch to a vetted service
  provider network, preventative maintenance scheduling, equipment and asset inventory, invoice
  assurance and R&M spend analytics — and is used by operators and franchisees of brands including
  McDonald's, Wendy's, Taco Bell, Jersey Mike's, Five Guys and Wingstop. The product is delivered as
  an end-user web portal (portal.86repairs.com) and iOS/Android mobile apps, backed by a private
  NestJS service at eightysix-api.86repairs.com; it is not offered as a developer platform. Parts
  Town, the Addison, Illinois OEM foodservice parts distributor, acquired 86 Repairs in June 2026 to
  connect parts availability with repair and service workflows. As of this profile 86 Repairs
  publishes no public API: no developer portal, no API reference, no OpenAPI/AsyncAPI/GraphQL
  contract, no SDK or package on any public registry, no webhook catalog, no MCP server and no A2A
  agent card were found on any host it controls.
